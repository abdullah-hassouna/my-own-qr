<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro QR SaaS (GitHub API)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">

    <script>
        // CONFIGURATION - Update these!
        const GITHUB_USER = 'YOUR_USERNAME';
        const GITHUB_REPO = 'YOUR_REPO_NAME';
        const JSON_PATH = 'links.json';
        
        // Check for redirect first
        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('id');

        async function handleRedirect() {
            if (linkId) {
                const response = await fetch(`./${JSON_PATH}?t=${Date.now()}`);
                const links = await response.json();
                if (links[linkId]) {
                    window.location.href = links[linkId];
                } else {
                    document.getElementById('status').innerText = "Link Not Found";
                }
            }
        }
        handleRedirect();
    </script>

    <div id="dashboard" class="max-w-3xl mx-auto py-12 px-4">
        <header class="mb-8">
            <h1 class="text-3xl font-bold">QR Hub</h1>
            <p id="status" class="text-slate-500">Connected to GitHub Database</p>
        </header>

        <div id="setup" class="bg-yellow-50 p-4 border border-yellow-200 rounded-lg mb-6">
            <p class="text-sm mb-2 font-semibold">GitHub Token Required for Saving:</p>
            <input id="ghToken" type="password" placeholder="Paste GitHub Token" class="w-full p-2 border rounded">
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input id="slug" type="text" placeholder="Slug (e.g., store)" class="p-2 border rounded">
                <input id="target" type="url" placeholder="Destination URL" class="p-2 border rounded">
            </div>
            <button onclick="updateDatabase()" id="saveBtn" class="w-full mt-4 bg-black text-white py-2 rounded font-medium hover:bg-slate-800">Commit to GitHub</button>
        </div>

        <div id="qrBox" class="hidden bg-white p-6 rounded-xl border mb-6 text-center">
            <div id="qrcode" class="inline-block p-4 bg-white"></div>
            <p id="readyUrl" class="text-xs font-mono mt-2"></p>
        </div>

        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b">
                    <tr>
                        <th class="px-6 py-3 text-xs uppercase font-bold text-slate-500">Path</th>
                        <th class="px-6 py-3 text-xs uppercase font-bold text-slate-500">Destination</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>

    <script>
    async function fetchLinks() {
    // Adding a timestamp (?t=) prevents the browser from showing "old" data (caching)
    const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${JSON_PATH}?t=${Date.now()}`;
    
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Could not reach GitHub API");

        const data = await res.json();
        currentSha = data.sha; // Crucial for the 'PUT' update later

        /** * SAFE DECODING: 
         * 1. Remove newlines/spaces from the Base64 string
         * 2. Decode Base64 to a binary string
         * 3. Handle UTF-8 characters (like emojis or special symbols)
         */
        const base64Clean = data.content.replace(/\s/g, '');
        const decodedString = decodeURIComponent(escape(atob(base64Clean)));
        const content = JSON.parse(decodedString);
        
        // Update the UI Table
        const list = document.getElementById('list');
        list.innerHTML = "";
        
        Object.entries(content).forEach(([slug, targetUrl]) => {
            const row = document.createElement('tr');
            row.className = "border-b hover:bg-slate-50 transition";
            row.innerHTML = `
                <td class="px-6 py-4 font-mono text-sm text-blue-600">?id=${slug}</td>
                <td class="px-6 py-4 text-sm text-slate-600 truncate max-w-xs">${targetUrl}</td>
                <td class="px-6 py-4 text-right">
                    <button onclick="showQR('${slug}')" class="text-xs bg-slate-100 px-2 py-1 rounded">QR</button>
                </td>
            `;
            list.appendChild(row);
        });
        
        return content;

    } catch (err) {
        console.error("Fetch Error:", err);
        document.getElementById('status').innerText = "Database Error: " + err.message;
        return {};
    }
}</script>
</body>
</html>
