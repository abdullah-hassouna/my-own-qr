<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro QR SaaS (GitHub API)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">

    <script>
        // CONFIGURATION - Update these!
        const GITHUB_USER = 'abdullah-hassouna';
        const GITHUB_REPO = 'my-own-qr';
        const JSON_PATH = 'links.json';
        
        // Check for redirect first
        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('id');

        async function handleRedirect() {
            if (linkId) {
                const response = await fetch(`./${JSON_PATH}?t=${Date.now()}`);
                const links = await response.json();
                if (links[linkId]) {
                    window.location.href = links[linkId];
                } else {
                    document.getElementById('status').innerText = "Link Not Found";
                }
            }
        }
        handleRedirect();
    </script>

    <div id="dashboard" class="max-w-3xl mx-auto py-12 px-4">
        <header class="mb-8">
            <h1 class="text-3xl font-bold">QR Hub</h1>
            <p id="status" class="text-slate-500">Connected to GitHub Database</p>
        </header>

        <div id="setup" class="bg-yellow-50 p-4 border border-yellow-200 rounded-lg mb-6">
            <p class="text-sm mb-2 font-semibold">GitHub Token Required for Saving:</p>
            <input id="ghToken" type="password" placeholder="Paste GitHub Token" class="w-full p-2 border rounded">
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input id="slug" type="text" placeholder="Slug (e.g., store)" class="p-2 border rounded">
                <input id="target" type="url" placeholder="Destination URL" class="p-2 border rounded">
            </div>
            <button onclick="updateDatabase()" id="saveBtn" class="w-full mt-4 bg-black text-white py-2 rounded font-medium hover:bg-slate-800">Commit to GitHub</button>
        </div>

        <div id="qrBox" class="hidden bg-white p-6 rounded-xl border mb-6 text-center">
            <div id="qrcode" class="inline-block p-4 bg-white"></div>
            <p id="readyUrl" class="text-xs font-mono mt-2"></p>
        </div>

        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b">
                    <tr>
                        <th class="px-6 py-3 text-xs uppercase font-bold text-slate-500">Path</th>
                        <th class="px-6 py-3 text-xs uppercase font-bold text-slate-500">Destination</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>

<script>
    // These must be at the very top of your script
    let currentSha = "";

    async function fetchLinks() {
        const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${JSON_PATH}?t=${Date.now()}`;
        
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error("Could not reach GitHub API");

            const data = await res.json();
            currentSha = data.sha; 

            // Safe decoding
            const base64Clean = data.content.replace(/\s/g, '');
            const decodedString = decodeURIComponent(escape(atob(base64Clean)));
            const content = JSON.parse(decodedString);
            
            const list = document.getElementById('list');
            list.innerHTML = "";
            
            Object.entries(content).forEach(([slug, targetUrl]) => {
                const row = document.createElement('tr');
                row.className = "border-b hover:bg-slate-50 transition";
                row.innerHTML = `
                    <td class="px-6 py-4 font-mono text-sm text-blue-600">?id=${slug}</td>
                    <td class="px-6 py-4 text-sm text-slate-600 truncate max-w-xs">${targetUrl}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="showQR('${slug}')" class="text-xs bg-slate-100 px-2 py-1 rounded">QR</button>
                    </td>
                `;
                list.appendChild(row);
            });
            
            return content;
        } catch (err) {
            console.error("Fetch Error:", err);
            return {};
        }
    }

    // This is the function that was "missing"
    async function updateDatabase() {
        const token = document.getElementById('ghToken').value;
        const slug = document.getElementById('slug').value.trim().toLowerCase();
        const target = document.getElementById('target').value.trim();
        const btn = document.getElementById('saveBtn');

        if(!token || !slug || !target) {
            alert("Please provide: Token, Slug, and Destination URL");
            return;
        }
        
        btn.innerText = "Syncing with GitHub...";
        btn.disabled = true;

        try {
            const currentContent = await fetchLinks();
            currentContent[slug] = target;

            const updatedBody = {
                message: `Update QR: ${slug}`,
                content: btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2)))),
                sha: currentSha
            };

            const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${JSON_PATH}`, {
                method: 'PUT',
                headers: { 
                    'Authorization': `token ${token}`, 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify(updatedBody)
            });

            if(response.ok) {
                btn.innerText = "Saved Successfully!";
                showQR(slug);
                setTimeout(() => { 
                    btn.innerText = "Commit to GitHub"; 
                    btn.disabled = false; 
                }, 2000);
                fetchLinks(); // Refresh the table
            } else {
                const errorData = await response.json();
                alert("GitHub Error: " + errorData.message);
                btn.disabled = false;
                btn.innerText = "Commit to GitHub";
            }
        } catch (err) {
            alert("Connection Error: " + err.message);
            btn.disabled = false;
        }
    }

    function showQR(slug) {
        const box = document.getElementById('qrBox');
        const qrDiv = document.getElementById('qrcode');
        qrDiv.innerHTML = "";
        
        // Get base URL without params
        const baseUrl = window.location.href.split('?')[0];
        const finalUrl = `${baseUrl}?id=${slug}`;
        
        document.getElementById('readyUrl').innerText = finalUrl;
        box.classList.remove('hidden');
        
        new QRCode(qrDiv, { 
            text: finalUrl, 
            width: 150, 
            height: 150,
            correctLevel : QRCode.CorrectLevel.H
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initial load
    fetchLinks();
</script>
    
</body>
</html>
