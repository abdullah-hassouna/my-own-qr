<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Manager SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap');
        body { font-family: 'IBM+Plex+Sans+Arabic', sans-serif; }
        .ltr { direction: ltr; text-align: left; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="redirector" class="hidden fixed inset-0 bg-white z-[999] flex flex-col items-center justify-center text-center p-6">
        <div class="mb-6 animate-bounce text-blue-600">
            <svg class="w-20 h-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-2">اسم موقعك</h1>
        <p class="text-xl text-gray-500">يتم التحويل إلى...</p>
        <p id="targetName" class="mt-4 font-mono text-sm text-blue-500 bg-blue-50 px-4 py-2 rounded-full ltr"></p>
    </div>

    <div id="dashboard" class="max-w-3xl mx-auto py-12 px-4" dir="ltr">
        <header class="mb-8 text-center md:text-left">
            <h1 class="text-3xl font-bold text-slate-900">QR Manager SaaS</h1>
            <p class="text-slate-500">Self-hosted link management via GitHub API</p>
        </header>

        <div id="setup" class="bg-amber-50 p-4 border border-amber-200 rounded-xl mb-6">
            <label class="block text-xs font-bold uppercase text-amber-700 mb-1">GitHub Personal Access Token</label>
            <input id="ghToken" type="password" placeholder="Paste your token here..." class="w-full p-2 border border-amber-300 rounded focus:ring-2 focus:ring-amber-500 outline-none">
            <p class="text-[10px] text-amber-600 mt-1">Token is never stored in code. Paste it only when you want to save changes.</p>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8">
            <h2 class="text-lg font-semibold mb-4">Create New Redirect</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input id="slug" type="text" placeholder="Short Name (e.g. tailor)" class="p-3 border rounded-lg outline-none focus:border-blue-500">
                <input id="target" type="url" placeholder="Destination (https://...)" class="p-3 border rounded-lg outline-none focus:border-blue-500">
            </div>
            <button onclick="updateDatabase()" id="saveBtn" class="w-full mt-4 bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-lg shadow-blue-200">Commit to GitHub</button>
        </div>

        <div id="qrBox" class="hidden bg-white p-8 rounded-2xl border border-blue-200 mb-8 text-center animate-in fade-in zoom-in duration-300">
            <h3 class="font-bold mb-4">Generated QR Code</h3>
            <div id="qrcode" class="inline-block bg-white p-2"></div>
            <p id="readyUrl" class="text-xs font-mono mt-4 text-slate-400 break-all"></p>
            <button onclick="document.getElementById('qrBox').classList.add('hidden')" class="mt-4 text-slate-400 hover:text-slate-600 text-xs underline">Close</button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b border-slate-200">
                    <tr>
                        <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Slug</th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Target URL</th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="list" class="divide-y divide-slate-100">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        /** CONFIGURATION **/
        // Automatically detects your GitHub Username and Repo from the URL
        const GITHUB_USER = window.location.hostname.split('.')[0];
        const GITHUB_REPO = window.location.pathname.split('/').filter(p => p)[0] || 'your-repo-name';
        const JSON_PATH = 'links.json';
        let currentSha = "";

        /** REDIRECT LOGIC **/
        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('id');

        if (linkId) {
            document.getElementById('redirector').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');

            async function startRedirect() {
                try {
                    const response = await fetch(`./${JSON_PATH}?t=${Date.now()}`);
                    const links = await response.json();
                    
                    if (links[linkId]) {
                        document.getElementById('targetName').innerText = links[linkId];
                        setTimeout(() => { window.location.href = links[linkId]; }, 1800);
                    } else {
                        document.getElementById('redirector').innerHTML = `<h1 class="text-red-500 font-bold text-2xl">الرابط غير موجود</h1><a href="?" class="mt-4 text-blue-600 underline">العودة للوحة التحكم</a>`;
                    }
                } catch (e) {
                    console.error(e);
                }
            }
            startRedirect();
        }

        /** DASHBOARD LOGIC **/
        async function fetchLinks() {
            const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${JSON_PATH}?t=${Date.now()}`;
            try {
                const res = await fetch(url);
                if (!res.ok) return {};

                const data = await res.json();
                currentSha = data.sha;
                const content = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));
                
                const list = document.getElementById('list');
                list.innerHTML = "";
                Object.entries(content).forEach(([slug, target]) => {
                    list.innerHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="px-6 py-4 font-mono text-sm text-blue-600">?id=${slug}</td>
                            <td class="px-6 py-4 text-sm text-slate-500 truncate max-w-[200px] font-mono">${target}</td>
                            <td class="px-6 py-4 text-right">
                                <button onclick="showQR('${slug}')" class="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-1 rounded-md hover:bg-slate-200">QR</button>
                            </td>
                        </tr>`;
                });
                return content;
            } catch (err) {
                console.error(err);
                return {};
            }
        }

        async function updateDatabase() {
            const token = document.getElementById('ghToken').value;
            const slug = document.getElementById('slug').value.trim().toLowerCase();
            const target = document.getElementById('target').value.trim();
            const btn = document.getElementById('saveBtn');

            if(!token || !slug || !target) return alert("Missing Token, Slug, or URL");
            
            btn.innerText = "Syncing with GitHub...";
            btn.disabled = true;

            const currentContent = await fetchLinks();
            currentContent[slug] = target;

            const updatedBody = {
                message: `Update link: ${slug}`,
                content: btoa(unescape(encodeURIComponent(JSON.stringify(currentContent, null, 2)))),
                sha: currentSha
            };

            const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${JSON_PATH}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedBody)
            });

            if(response.ok) {
                btn.innerText = "Success!";
                showQR(slug);
                setTimeout(() => { btn.innerText = "Commit to GitHub"; btn.disabled = false; }, 2000);
                fetchLinks();
            } else {
                alert("Error: Check your Token and Repo Settings");
                btn.disabled = false;
                btn.innerText = "Commit to GitHub";
            }
        }

        function showQR(slug) {
            const box = document.getElementById('qrBox');
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = "";
            const baseUrl = window.location.href.split('?')[0];
            const finalUrl = `${baseUrl}?id=${slug}`;
            document.getElementById('readyUrl').innerText = finalUrl;
            box.classList.
