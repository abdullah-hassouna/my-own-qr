<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Manager SaaS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap');
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
        .ltr { direction: ltr; text-align: left; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="redirector" class="hidden fixed inset-0 bg-white z-[999] flex flex-col items-center justify-center text-center p-6">
        <div class="mb-6 animate-bounce text-blue-600">
            <svg class="w-20 h-20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-2">اسم الموقع الخاص بك</h1>
        <p class="text-xl text-gray-500">يتم التحويل إلى...</p>
        <p id="targetName" class="mt-4 font-mono text-sm text-blue-500 bg-blue-50 px-4 py-2 rounded-full ltr"></p>
    </div>

    <div id="dashboard" class="max-w-3xl mx-auto py-12 px-4" dir="ltr">
        <header class="mb-8 text-center md:text-left ltr">
            <h1 class="text-3xl font-bold text-slate-900">QR Manager SaaS</h1>
            <p id="status" class="text-slate-500">Enter GitHub Token to unlock database</p>
        </header>

        <div id="setup" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 ltr">
            <label class="block text-xs font-bold uppercase text-slate-400 mb-2">GitHub Personal Access Token (ghp_...)</label>
            <input id="ghToken" type="password" placeholder="Paste token to load links..." 
                   class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
        </div>

        <div id="formContainer" class="opacity-50 pointer-events-none bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-8 ltr">
            <h2 class="text-lg font-semibold mb-4">Create New Redirect</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input id="slug" type="text" placeholder="Name (e.g. My Project)" class="p-3 border rounded-xl outline-none focus:border-blue-500">
                <input id="target" type="url" placeholder="URL (https://...)" class="p-3 border rounded-xl outline-none focus:border-blue-500">
            </div>
            <button onclick="updateDatabase()" id="saveBtn" class="w-full mt-4 bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">Commit to GitHub</button>
        </div>

        <div id="qrBox" class="hidden bg-white p-8 rounded-2xl border-2 border-dashed border-blue-200 mb-8 text-center ltr">
            <div id="qrcode" class="inline-block bg-white p-2 mb-4"></div>
            <p id="readyUrl" class="text-xs font-mono text-blue-500 break-all"></p>
            <button onclick="document.getElementById('qrBox').classList.add('hidden')" class="mt-4 text-slate-400 text-xs underline">Close</button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden ltr">
            <table class="w-full text-left">
                <thead class="bg-slate-50 border-b border-slate-200">
                    <tr>
                        <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Redirect Name</th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase">Destination</th>
                        <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="list" class="divide-y divide-slate-100 italic text-slate-300 text-center">
                    <tr><td colspan="3" class="py-10">Locked: Enter Token Above</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        /** AUTO-CONFIG **/
        const GITHUB_USER = window.location.hostname.split('.')[0];
        const GITHUB_REPO = window.location.pathname.split('/').filter(p => p)[0] || 'your-repo-name';
        const JSON_PATH = 'links.json';
        let currentSha = "";

        const tokenInput = document.getElementById('ghToken');
        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('id');

        /** 1. REDIRECT LOGIC **/
        if (linkId) {
            document.getElementById('redirector').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');

            async function startRedirect() {
                try {
                    const response = await fetch(`./${JSON_PATH}?t=${Date.now()}`);
                    const links = await response.json();
                    const cleanId = linkId.toLowerCase().replace(/[\s_]+/g, '-');
                    
                    if (links[cleanId]) {
                        document.getElementById('targetName').innerText = links[cleanId];
                        setTimeout(() => { window.location.href = links[cleanId]; }, 1800);
                    } else {
                        document.getElementById('redirector').innerHTML = `
                            <h1 class="text-red-500 font-bold text-2xl">الرابط غير موجود</h1>
                            <p class="text-slate-400 mt-2">ID: ${cleanId}</p>
                            <a href="?" class="mt-6 text-blue-600 underline">العودة للرئيسية</a>`;
                    }
                } catch (e) { console.error(e); }
            }
            startRedirect();
        }

        /** 2. DASHBOARD SECURITY GATE **/
        tokenInput.addEventListener('input', () => {
            if (tokenInput.value.length >= 35) { // Typical GHP token length
                fetchLinks();
            }
        });

        async function fetchLinks() {
            const token = tokenInput.value;
            const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${JSON_PATH}?t=${Date.now()}`;
            
            try {
                const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
                if (!res.ok) throw new Error("Unauthorized");

                const data = await res.json();
                currentSha = data.sha;
                const content = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\s/g, '')))));
                
                renderTable(content);
                unlockUI();
                return content;
            } catch (err) {
                document.getElementById('status').innerText = "❌ Connection Failed: Check Token";
                return null;
            }
        }

        function unlockUI() {
            document.getElementById('status').innerText = "✅ Connected to GitHub";
            document.getElementById('formContainer').classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('setup').classList.add('border-green-200', 'bg-green-50');
        }

        function renderTable(links) {
            const list = document.getElementById('list');
            list.innerHTML = "";
            Object.entries(links).forEach(([name, target]) => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50 transition ltr";
                row.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="flex flex-col">
                            <span class="font-bold text-slate-800">${name}</span>
                            <span class="text-[10px] text-blue-500 font-mono">?id=${name}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-sm text-slate-500 truncate max-w-[200px] font-mono">${target}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="showQR('${name}')" class="text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100">QR</button>
                    </td>`;
                list.appendChild(row);
            });
        }

        /** 3. DATABASE UPDATE LOGIC **/
        async function updateDatabase() {
            const token = tokenInput.value;
            let rawName = document.getElementById('slug').value.trim();
            const target = document.getElementById('target').value.trim();
            const btn = document.getElementById('saveBtn');

            if(!rawName || !target) return alert("Fill Name and URL");

            // Sanitize: Spaces/Underscores -> Hyphen
            const cleanKey = rawName.toLowerCase().replace(/[\s_]+/g, '-').replace(/-+/g, '-').replace(/^-+|-+$/g, '');

            btn.innerText = "Syncing...";
            btn.disabled = true;

            try {
                const links = await fetchLinks(); 
                if(!links) return;

                links[cleanKey] = target;

                const updatedBody = {
                    message: `QR Update: ${cleanKey}`,
                    content: btoa(unescape(encodeURIComponent(JSON.stringify(links, null, 2)))),
                    sha: currentSha
                };

                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${JSON_PATH}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedBody)
                });

                if(response.ok) {
                    btn.innerText = "Saved Successfully!";
                    showQR(cleanKey);
                    fetchLinks();
                    document.getElementById('slug').value = "";
                    document.getElementById('target').value = "";
                }
            } catch (e) { alert("Error: " + e.message); }
            setTimeout(() => { btn.innerText = "Commit to GitHub"; btn.disabled = false; }, 2000);
        }

        function showQR(slug) {
            const box = document.getElementById('qrBox');
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = "";
            const baseUrl = window.location.href.split('?')[0];
            const finalUrl = `${baseUrl}?id=${slug}`;
            document.getElementById('readyUrl').innerText = finalUrl;
            box.classList.remove('hidden');
            new QRCode(qrDiv, { text: finalUrl, width: 180, height: 180, correctLevel : QRCode.CorrectLevel.H });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
