<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جاري التحويل...</title>
    
    <script>
        /** * تشغيل الكود فوراً قبل تحميل أي عنصر HTML 
         * الهدف: استخراج الرابط الوجهة من المسار (Path) وتوجيه المستخدم
         **/
        (function() {
            // 1. الحصول على الرابط الكامل
            const fullUrl = window.location.href;
            
            // 2. تحديد الكلمة المفتاحية (اسم المستودع)
            const repoName = "my-own-qr/";
            const startIndex = fullUrl.indexOf(repoName);

            if (startIndex !== -1) {
                // 3. استخراج كل ما بعد "my-own-qr/"
                let target = fullUrl.substring(startIndex + repoName.length);

                // 4. تنظيف الرابط من أي سلاش زائد في البداية
                target = target.replace(/^\/+/, '');

                if (target) {
                    // تصحيح الرابط إذا كان لا يبدأ بـ http (مثل vercel.app)
                    if (!target.startsWith('http')) {
                        target = 'https://' + target;
                    }

                    // 5. التوجيه الفوري (Replace تمنع المستخدم من العودة لصفحة الـ 404 عند الضغط على Back)
                    window.location.replace(target);
                } else {
                    // إذا كان المسار فارغاً، ننتظر تحميل الصفحة لعرض الواجهة الرئيسية
                    window.addEventListener('DOMContentLoaded', () => {
                         window.location.href = "index.html";
                    });
                }
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&display=swap');
        body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen text-center p-6">

    <div id="fallback-ui">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4 mx-auto"></div>
        <h1 class="text-xl font-bold text-slate-800">جاري توجيهك إلى الوجهة المطلوبة...</h1>
        <p class="text-slate-400 mt-2 text-sm">إذا لم يتم تحويلك تلقائياً، يرجى التحقق من الرابط.</p>
    </div>

</body>
</html>
